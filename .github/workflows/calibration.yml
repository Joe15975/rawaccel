name: Calibration build and tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'grapher/**'
      - 'service/**'
      - 'service-shared/**'
      - 'wrapper/**'
      - 'wrapper-tests/**'
      - 'common/**'
      - 'calibration-tests/**'
      - 'service-tests/**'
      - 'tools/**'
      - '.github/workflows/calibration.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - name: Build source wrapper and run tests
        shell: powershell
        run: .\tools\Build-Calibration.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-windows-x64
          path: artifacts/calibration-release
          if-no-files-found: ignore
